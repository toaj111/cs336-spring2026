experiment_name: str = "baseline"
experiments_dir: str = "cs336_basics/experiments"

# Model hyperparameters
vocab_size: 10000
context_length: 256
d_model: 512
num_layers: 4
num_heads: 16
d_ff: 1344
rope_theta: 10000

# Device and dtype
device: cuda:0
dtype: null

# Ablation experiments
use_rope: true
use_rms_norm: true
use_pre_norm: true
use_swiglu: true

# Dataset
training_data_path: cs336_basics/data/test_train.npy
valid_data_path: cs336_basics/data/test_valid.npy

# Training
batch_size: 64
eval_batches: 10
max_iters: 20000
max_checkpoints: 5
checkpoints_dir: checkpoints

# Optimizer
optimizer: adamw
lr: 0.001
weight_decay: 0.01
beta1: 0.9
beta2: 0.999
eps: 1.0e-8
lr_strategy: cosine_lr_schedule_with_warmup

# Logging and checkpointing
logging_interval: 100
eval_interval: 200
save_interval: 1000
